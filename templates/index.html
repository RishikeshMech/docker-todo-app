<!DOCTYPE html>
<html>
<head>
    <title>Docker Todo App</title>
</head>
<body>
    <h1>My Task Manager</h1>

    <form action="/add" method="POST">
        <input name="task" placeholder="Enter task" required>
        <button type="submit">Add Task</button>
    </form>

    <h2>Tasks</h2>

    {% for task in tasks %}
        <p>
            {{ task[1] }}
            <a href="/delete/{{ task[0] }}">Delete</a>
        </p>
    {% endfor %}
</body>
</html>
