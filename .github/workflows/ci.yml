name: Python To Do App CI Pipeline

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  IMAGE_NAME: $${{ secrets.DOCKER_USERNAME }}/python-todo-app
jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run lint Test
        run: |
          python -m pip install --upgrade pip
          if [ -f requirnments.txt ]; then pip install -r requirnments.txt; fi
          pip install flake8 pytest
          flake8 . --count --slelect=E9,F63,F7,F82 --show-source --statistics
          pytest || true
      - name: Set Up Docker Buildex 
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image 
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false 
          load: true 
          tags: $${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Run Trivy 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: LOG in to docker hub 
        if: github.event_name == 'push' && github.ref == 'ref/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true 
          tags: | 
            $${{ env.IMAGE_NAME }}:$${{ github.sha }}
            $${{ env.IMAGE_NAME }}:latest
